apiVersion: v1
kind: Secret
metadata:
    name: postgres-bootstrap
type: Opaque
stringData:
    user-data: |
        #cloud-config
        hostname: postgres
        users:
          - name: ubuntu
            sudo: ALL=(ALL) NOPASSWD:ALL
            shell: /bin/bash
            lock_passwd: false
            ssh_authorized_keys:
              - ssh-rsa  holuser@console
        package_update: true
        package_upgrade: false
        packages:
          - postgresql
          - git
          - bind9-dnsutils
        write_files:
          - path: /etc/bank/tsig.key
            permissions: '0600'
            content: |
              key "update-key" {
                  algorithm hmac-sha256;
                  secret "C5oOXzv1cN3Sd5VYx7uH+TpKQB8K5J0jSqQ5kPdJfFY=";
              };
          - path: /etc/systemd/resolved.conf.d/bank.conf
            permissions: '0644'
            content: |
              [Resolve]
              DNS=$DNS_VIP
              Domains=$NS.svc.cluster.local
              FallbackDNS=10.1.1.1 8.8.8.8
        runcmd:
          - systemctl restart systemd-resolved
          - git clone https://github.com/prydin/bank-sample-app.git /opt/bank-app
          - chmod +x /opt/bank-app/k8s-vm/bank-register-dns.sh
          # - /opt/bank-app/k8s-vm/bank-register-dns.sh
          - |
            set -eu
            export PG_CONF_DIR=$(ls -d /etc/postgresql/*/main | head -n1)
            echo "listen_addresses = '*'" >> "$PG_CONF_DIR/postgresql.conf"
            echo "host all all 0.0.0.0/0 md5" >> "$PG_CONF_DIR/pg_hba.conf"
          - systemctl restart postgresql
          - sudo -u postgres psql -c "CREATE USER bank WITH PASSWORD 'bank';"
          - sudo -u postgres psql -c "CREATE DATABASE bankdb OWNER bank;"
          - sudo -u postgres psql -d bankdb -f /opt/bank-app/db/init.sql
          - sudo -u postgres psql -d bankdb -f /opt/bank-app/db/seed.sql
          - sudo -u postgres psql -d bankdb -c "GRANT ALL ON ALL TABLES IN SCHEMA public TO bank;"
          - sudo -u postgres psql -d bankdb -c "GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO bank;"
---
apiVersion: v1
kind: Secret
metadata:
    name: backend-bootstrap
type: Opaque
stringData:
    user-data: |
        #cloud-config
        hostname: backend
        users:
          - name: ubuntu
            sudo: ALL=(ALL) NOPASSWD:ALL
            shell: /bin/bash
            lock_passwd: false
            ssh_authorized_keys:
              - ssh-rsa  holuser@console
        package_update: true
        package_upgrade: false
        packages:
          - ca-certificates
          - curl
          - git
          - bind9-dnsutils
        write_files:
          - path: /etc/bank/tsig.key
            permissions: '0600'
            content: |
              key "update-key" {
                  algorithm hmac-sha256;
                  secret "C5oOXzv1cN3Sd5VYx7uH+TpKQB8K5J0jSqQ5kPdJfFY=";
              };
          - path: /etc/systemd/resolved.conf.d/bank.conf
            permissions: '0644'
            content: |
              [Resolve]
              DNS=$DNS_VIP
              Domains=$NS.svc.cluster.local
              FallbackDNS=10.1.1.1 8.8.8.8
          - path: /etc/systemd/system/bank-backend.service
            permissions: '0644'
            content: |
              [Unit]
              Description=Bank backend (Node.js)
              After=network-online.target
              Wants=network-online.target

              [Service]
              Environment=DATABASE_URL=postgres://bank:bank@postgres:5432/bankdb
              Environment=PORT=4000
              Environment=CORS_ORIGIN=*
              Environment=NODE_ENV=production
              WorkingDirectory=/opt/bank-app/backend
              ExecStart=/usr/bin/node dist/index.js
              Restart=always
              RestartSec=5

              [Install]
              WantedBy=multi-user.target
        runcmd:
          - systemctl restart systemd-resolved
          - git clone https://github.com/prydin/bank-sample-app.git /opt/bank-app
          - chmod +x /opt/bank-app/k8s-vm/bank-register-dns.sh
         # - /opt/bank-app/k8s-vm/bank-register-dns.sh
          - bash -lc "curl -fsSL https://deb.nodesource.com/setup_20.x | bash -"
          - apt-get install -y nodejs
          - bash -lc "cd /opt/bank-app/backend && npm install && npm run build"
          - systemctl daemon-reload
          - systemctl enable --now bank-backend
---
---
apiVersion: v1
kind: Secret
metadata:
    name: frontend-bootstrap
type: Opaque
stringData:
    user-data: |
        #cloud-config
        hostname: frontend
        users:
          - name: ubuntu
            sudo: ALL=(ALL) NOPASSWD:ALL
            shell: /bin/bash
            lock_passwd: false
            ssh_authorized_keys:
              - ssh-rsa  holuser@console
        package_update: true
        package_upgrade: false
        packages:
          - ca-certificates
          - curl
          - git
          - nginx
          - bind9-dnsutils
        write_files:
          - path: /etc/bank/tsig.key
            permissions: '0600'
            content: |
              key "update-key" {
                  algorithm hmac-sha256;
                  secret "C5oOXzv1cN3Sd5VYx7uH+TpKQB8K5J0jSqQ5kPdJfFY=";
              };
          - path: /etc/systemd/resolved.conf.d/bank.conf
            permissions: '0644'
            content: |
              [Resolve]
              DNS=$DNS_VIP
              Domains=$NS.svc.cluster.local
              FallbackDNS=10.1.1.1 8.8.8.8
        runcmd:
          - systemctl restart systemd-resolved
          - git clone https://github.com/prydin/bank-sample-app.git /opt/bank-app
          - chmod +x /opt/bank-app/k8s-vm/bank-register-dns.sh
          # - /opt/bank-app/k8s-vm/bank-register-dns.sh
          - bash -lc "curl -fsSL https://deb.nodesource.com/setup_20.x | bash -"
          - apt-get install -y nodejs
          - bash -lc "cd /opt/bank-app/frontend && npm install && npm run build"
          - rm -rf /usr/share/nginx/html
          - cp -r /opt/bank-app/frontend/dist /usr/share/nginx/html
          - rm -f /etc/nginx/sites-enabled/default
          - cp /opt/bank-app/frontend/nginx.conf /etc/nginx/conf.d/bank.conf
          - bash -lc 'for i in $(seq 1 120); do getent hosts backend.$NS.svc.cluster.local >/dev/null 2>&1 && break; echo "waiting for backend.$NS.svc.cluster.local..."; sleep 5; done'
          - nginx -t
          - systemctl restart nginx
